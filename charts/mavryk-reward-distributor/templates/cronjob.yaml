apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mavryk-reward-distributor.fullname" . }}
  labels:
    {{- include "mavryk-reward-distributor.labels" . | nindent 4 }}
spec:

  # important to prevent launch of concurrent payout processes
  concurrencyPolicy: Forbid

  failedJobsHistoryLimit: 100
  schedule: {{ .Values.schedule }}
  jobTemplate:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mavryk-reward-distributor.selectorLabels" . | nindent 8 }}
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 1000
          volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: {{ include "mavryk-reward-distributor.fullname" . }}-volume
            - name: config-volume
              configMap:
                name: {{ include "mavryk-reward-distributor.fullname" . }}-config
            {{- if .Values.bucket_upload.bucket_name }}
            - name: secret-volume
              secret:
                secretName: {{ include "mavryk-reward-distributor.fullname" . }}-secret
            {{- end }}
          initContainers:
            # Work around a bug where fsGroup is ignored
            - name: change-ownership-container
              image: {{ .Values.images.mavryk_reward_distributor }}
              command:
              - /bin/sh
              - -c
              - "mkdir -p /mrd/cfg && chown -R 1000:1000 /mrd"
              securityContext:
                runAsUser: 0
                privileged: true
              volumeMounts:
              - mountPath: /mrd
                name: storage
            {{- if .Values.bucket_upload.bucket_name }}
            # When uploading reports, MRD runs as an init container so it fully
            # completes before the uploader (the main container) runs.
            {{- include "mavryk-reward-distributor.runContainer" . | nindent 12 }}
            {{- end }}
          containers:
            {{- if .Values.bucket_upload.bucket_name }}
            - name: report-uploader
              image: {{ .Values.mavryk_k8s_images.snapshotEngine }}
              volumeMounts:
              - mountPath: /mrd
                name: storage
              - mountPath: /mrd/cfg/bucket_upload_secrets
                name: secret-volume
                subPath: bucket_upload_secrets
              command:
              - /bin/sh
              args:
              - "-c"
              - |
{{ tpl ($.Files.Get (print "scripts/bucket_upload.sh")) $ | indent 16 }}
              env:
              - name: BUCKET_ENDPOINT_URL
                value: "{{ .Values.bucket_upload.bucket_endpoint_url }}"
              - name: BUCKET_NAME
                value: "{{ .Values.bucket_upload.bucket_name }}"
              - name: BAKER_NAME
                value: {{ include "mavryk-reward-distributor.fullname" . }}
            {{- else }}
            # No report upload configured: MRD is the pod's main container.
            {{- include "mavryk-reward-distributor.runContainer" . | nindent 12 }}
            {{- end }}
          restartPolicy: OnFailure
