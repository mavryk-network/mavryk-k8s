# Faucet backend: https://github.com/mavryk-network/mavryk-faucet-backend
# Faucet frontend: https://github.com/mavryk-network/mavryk-faucet

images:
  mavrykFaucet: ghcr.io/mavryk-network/mavryk-faucet:3.0.0
  mavrykFaucetBackend: ghcr.io/mavryk-network/mavryk-faucet-backend:3.0.0

# Frontend app configuration. You can optionally deploy only the faucet backend.
enableUI: true
config:
  application:
    name: "Mavryk Faucet"
    googleCaptchaSiteKey: "" # 6LefC8QmAAAAAIX...
    apiMavrykUrl: "" # https://basenet.api.mavryk.network/v1
    # Default value assumes faucet backend is available on localhost.
    backendUrl: http://localhost:3000
    githubRepo: https://github.com/mavryk-network/mavryk-faucet
  network:
    name: Custom
    # Default value assumes node RPC is available on localhost.
    rpcUrl: http://localhost:8732
    faucetAddress: "" # mv1PW...
    viewer: "" # https://basenet.nexus.mavryk.org/explorer/operation

# Value the server sets for the "Access-Control-Allow-Origin" header for CORS.
authorizedHost: "*"
# RPC url for the faucet backend. Default value assumes mavryk-k8s created an RPC
# service in the same namespace. If not set, defaults to `config.network.rpcUrl`.
backendRpcUrl: http://mavryk-node-rpc:8732
# If the backend requires CAPTCHA tokens to be submitted.
enableCaptcha: true

# -- Token amount limits --
# MVRK (native token)
maxBalance: null # Faucet won't dispense MVRK if recipient balance exceeds this.
maxBalanceMvn: null # Max MVN balance for recipient. Not capped by default.
maxBalanceUsdt: null # Max USDT balance for recipient. Not capped by default.
minMav: 1
maxMav: 6000
# MVN (FA2 token)
minMvn: 1
maxMvn: 400
# USDT (FA2 token)
minUsdt: 1
maxUsdt: 1000

# -- FA2 token contracts --
mvnContractAddress: "KT1EWqLYMjrimcJRFWSPkNGNLnpiKBZHWZ86"
usdtContractAddress: "KT1WTEKHD2fH24d7JNGbquSiLPktz796WBmA"

# -- PoW challenges --
# Set to true to disable the requirement of solving PoW challenges.
disableChallenges: false
# Minimum number of challenges required for the minimum Mav request.
minChallenges: 1
# Maximum number of challenges required for the maximum Mav request.
maxChallenges: 550
# Maximum number of challenges with captcha.
maxChallengesWithCaptcha: 66
# How many bytes the challenge string should be.
challengeSize: 2048
# Difficulty level for challenges.
difficulty: 4

# -- Batch worker --
# How often the batch worker processes the queue (ms). ~1 block time.
batchIntervalMs: 15000
# Maximum transfers per batch transaction.
maxBatchSize: 50
# Max retry attempts before a request is permanently failed.
maxRetries: 3

# -- Cooldown --
# Enable per-address, per-token cooldown.
enableCooldown: true
# Hours between allowed requests per address per token.
cooldownHours: 24

# -- Mainnet balance gate --
# Require a minimum MVRK balance on mainnet to request testnet tokens.
enableMainnetGate: false
mainnetRpcUrl: "" # https://mainnet.rpc.mavryk.network
mainnetMinBalance: 10
mainnetCacheTtlS: 60

# -- Telegram alerts --
# Send alerts to a Telegram channel when faucet balance is low.
telegramBotToken: ""
telegramChatId: ""
telegramCheckIntervalMs: 600000
telegramWarningThreshold: 5000
telegramCriticalThreshold: 1000

# Config for the Redis backend for the PoW challenges. Redis is not needed if
# challenges are disabled.
redis:
  url: "" # redis://redis-master.redis:6379
  password: ""

# -- SQLite persistence --
# The backend stores faucet request state in SQLite. Enable persistence to
# survive pod restarts.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Secrets
googleCaptchaSecretKey: "" # 6LefC8QmAAAAAPH...
faucetPrivateKey: "" # edsk3X...

# Reference an existing secret and override the created secret
existingSecretName: ""

# Type of the service exposing the faucet deployment
serviceType: NodePort

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: "" # fill in the faucet hostname
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example-frontend.local

  # Separate ingress for the backend API. Use this when the frontend is hosted
  # externally (e.g. Cloudflare) and the backend needs its own public hostname.
  backend:
    enabled: false
    className: ""
    annotations: {}
    host: "" # e.g. faucet-api.mavryk.network
    tls: []

# Gateway API alternative to `ingress` above. Mutually exclusive in practice:
# enable one or the other. When enabled, creates a Gateway + HTTPRoute pair
# routing /info, /challenge, /verify, /status (+ optionally /) to the faucet
# Service on port 3000 (/) targets port 8080 when enableUI is true.
gateway:
  enabled: false
  className: envoy
  host: ""
  # Annotations on the Gateway resource (e.g. cert-manager.io/cluster-issuer).
  annotations: {}
  labels: {}
  # Name of the Secret holding the TLS cert for the HTTPS listener. Leave
  # empty to create an HTTP-only listener.
  tlsSecretName: ""
  # CORS — replaces nginx `enable-cors` / `cors-allow-*` annotations. Rendered
  # as an Envoy Gateway SecurityPolicy targeting the Gateway.
  cors:
    enabled: false
    allowOrigins:
      - "*"
    allowMethods:
      - GET
      - POST
      - OPTIONS
    allowHeaders: []
    exposeHeaders:
      - "*"
    maxAge: 1h
    allowCredentials: false
  # Local (per-pod) rate limit — replaces nginx `limit-rps` /
  # `limit-burst-multiplier`. Rendered into the BackendTrafficPolicy.
  rateLimit:
    enabled: false
    rules:
      - limit:
          requests: 5
          unit: Second
  # Upstream (Envoy → backend) timeouts — replaces nginx
  # `proxy-connect-timeout` / `proxy-read-timeout` / `proxy-send-timeout`.
  # Rendered into the BackendTrafficPolicy. `tcp` and `http` blocks are
  # passed verbatim, so any field Envoy Gateway's BackendTrafficPolicy
  # `spec.timeout.{tcp,http}` accepts works here.
  timeout:
    enabled: false
    tcp:
      connectTimeout: 1h
    http:
      connectionIdleTimeout: 1h
      requestTimeout: 1h
  # Upstream per-connection buffer limit — closest analogue to nginx
  # `proxy-buffer-size`. Rendered into the BackendTrafficPolicy. nginx's
  # `proxy-buffers-number` and `proxy-max-temp-file-size` have no Envoy
  # equivalent (Envoy streams natively, doesn't spill to disk).
  connection:
    enabled: false
    bufferLimit: "32Ki"
  # Downstream (client → Envoy) per-connection buffer limit — closest
  # analogue to nginx `proxy-buffering off`. Envoy already streams by
  # default; this just caps how much it holds for a slow client. Rendered
  # as a ClientTrafficPolicy.
  client:
    enabled: false
    bufferLimit: "32Ki"

  # Separate Gateway for the backend API. Use this when the frontend is hosted
  # externally (e.g. Cloudflare) and the backend needs its own public hostname.
  backend:
    enabled: false
    className: envoy
    host: ""
    annotations: {}
    labels: {}
    tlsSecretName: ""
    cors:
      enabled: false
      allowOrigins:
        - "*"
      allowMethods:
        - GET
        - POST
        - OPTIONS
      allowHeaders: []
      exposeHeaders:
        - "*"
      maxAge: 1h
      allowCredentials: false
    rateLimit:
      enabled: false
      rules:
        - limit:
            requests: 5
            unit: Second
    timeout:
      enabled: false
      tcp:
        connectTimeout: 1h
      http:
        connectionIdleTimeout: 1h
        requestTimeout: 1h
    connection:
      enabled: false
      bufferLimit: "32Ki"
    client:
      enabled: false
      bufferLimit: "32Ki"

imagePullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  annotations: {}
  name: mavryk-faucet

nodeSelector: {}

tolerations: []

affinity: {}
