{{- if .Values.enableUI }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: faucet-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: |
{{- $_ := set .Values.config.application "disableChallenges" .Values.disableChallenges }}
{{- $_ := set .Values.config.application "minMav" .Values.minMav }}
{{- $_ := set .Values.config.application "maxMav" .Values.maxMav }}
{{- $_ := set .Values.config.application "maintenance" false }}
{{ .Values.config | mustToPrettyJson | indent 4 }}
---
{{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: faucet-backend-config
  namespace: {{ .Release.Namespace }}
data:
  AUTHORIZED_HOST: "{{ .Values.authorizedHost }}"
  DISABLE_CHALLENGES: "{{ .Values.disableChallenges }}"
  ENABLE_CAPTCHA: "{{ .Values.enableCaptcha }}"
  {{- if .Values.maxBalance }}
  MAX_BALANCE: "{{ .Values.maxBalance }}"
  {{- end }}
  {{- if .Values.maxBalanceMvn }}
  MAX_BALANCE_MVN: "{{ .Values.maxBalanceMvn }}"
  {{- end }}
  {{- if .Values.maxBalanceUsdt }}
  MAX_BALANCE_USDT: "{{ .Values.maxBalanceUsdt }}"
  {{- end }}
  REDIS_URL: "{{ .Values.redis.url }}"
  RPC_URL: "{{ .Values.backendRpcUrl | default .Values.config.network.rpcUrl | required "An rpc url is required." }}"
  # Token limits
  MIN_MAV: "{{ .Values.minMav }}"
  MAX_MAV: "{{ .Values.maxMav }}"
  MIN_MVN: "{{ .Values.minMvn }}"
  MAX_MVN: "{{ .Values.maxMvn }}"
  MIN_USDT: "{{ .Values.minUsdt }}"
  MAX_USDT: "{{ .Values.maxUsdt }}"
  # FA2 contracts
  MVN_CONTRACT_ADDRESS: "{{ .Values.mvnContractAddress }}"
  USDT_CONTRACT_ADDRESS: "{{ .Values.usdtContractAddress }}"
  # PoW challenges
  MIN_CHALLENGES: "{{ .Values.minChallenges }}"
  MAX_CHALLENGES: "{{ .Values.maxChallenges }}"
  MAX_CHALLENGES_WITH_CAPTCHA: "{{ .Values.maxChallengesWithCaptcha }}"
  CHALLENGE_SIZE: "{{ .Values.challengeSize }}"
  DIFFICULTY: "{{ .Values.difficulty }}"
  # Batch worker
  SQLITE_PATH: "/app/data/faucet.db"
  BATCH_INTERVAL_MS: "{{ .Values.batchIntervalMs }}"
  MAX_BATCH_SIZE: "{{ .Values.maxBatchSize }}"
  MAX_RETRIES: "{{ .Values.maxRetries }}"
  # Cooldown
  ENABLE_COOLDOWN: "{{ .Values.enableCooldown }}"
  COOLDOWN_HOURS: "{{ .Values.cooldownHours }}"
  # Mainnet gate
  ENABLE_MAINNET_GATE: "{{ .Values.enableMainnetGate }}"
  {{- if .Values.mainnetRpcUrl }}
  MAINNET_RPC_URL: "{{ .Values.mainnetRpcUrl }}"
  {{- end }}
  MAINNET_MIN_BALANCE: "{{ .Values.mainnetMinBalance }}"
  MAINNET_CACHE_TTL_S: "{{ .Values.mainnetCacheTtlS }}"
  # Telegram alerts (non-secret config)
  TELEGRAM_CHECK_INTERVAL_MS: "{{ .Values.telegramCheckIntervalMs }}"
  TELEGRAM_WARNING_THRESHOLD: "{{ .Values.telegramWarningThreshold }}"
  TELEGRAM_CRITICAL_THRESHOLD: "{{ .Values.telegramCriticalThreshold }}"
