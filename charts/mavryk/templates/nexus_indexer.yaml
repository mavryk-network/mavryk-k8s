{{- $indexers := .Values.indexers | default dict }}
{{- $indexerConfig := $indexers.nexus | default dict }}
{{- if (include "mavryk.shouldDeployNexusIndexer" $indexerConfig) }}

apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 14000
      name: nexus
      targetPort: nexus
  selector:
    app: {{ .Values.nexus_indexer_statefulset.name }}
  type: {{ .Values.nexus_indexer_statefulset.serviceType }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-env
  namespace: {{ .Release.Namespace }}
data:
  NEXUS_ENV: {{ $indexerConfig.nexusEnv | default "sandbox" | quote }}
  GIN_MODE: {{ $indexerConfig.ginMode | default "debug" | quote }}
  SANDBOX_NODE_URI: {{ $indexerConfig.rpcUrl | quote }}
  {{- with $indexerConfig.ipfsGateway }}
  SANDBOX_IPFS_GATEWAY: {{ . | quote }}
  {{- end }}

{{- if not $indexerConfig.db.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-db-creds
  namespace: {{ .Release.Namespace }}
data:
  POSTGRES_USER: {{ b64enc $indexerConfig.db.user }}
  POSTGRES_PASSWORD: {{ b64enc $indexerConfig.db.password }}
  POSTGRES_DB: {{ b64enc $indexerConfig.db.name }}
{{- if not $indexerConfig.db.isExternal }}
  PGDATA: {{ b64enc "/var/lib/postgresql/data/pgdata" }}
{{- end }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-sandbox-config
  namespace: {{ .Release.Namespace }}
data:
  # Based on:
  # https://github.com/mavryk-network/nexushub/blob/fa7e36f6c890d543d72a3d494f7a2509cd41871a/configs/sandbox.yml
  sandbox.yml: |
    rpc:
      sandboxnet:
        uri: ${SANDBOX_NODE_URI}
        timeout: 10
        requests_per_second: 10
    storage:
      pg:
        host: ${DB_HOSTNAME:-db}
        port: 5432
        user: ${POSTGRES_USER}
        dbname: ${POSTGRES_DB:-nexus}
        password: ${POSTGRES_PASSWORD}
        sslmode: disable
      timeout: 10
    share_path: /etc/nexus
    base_url: http://localhost:8000
    api:
      project_name: api
      bind: ":14000"
      swagger_host: "localhost:8000"
      cors_enabled: true
      sentry_enabled: false
      seed_enabled: true
      page_size: ${PAGE_SIZE:-10}
      frontend:
        ga_enabled: false
        mempool_enabled: false
        sandbox_mode: true
      networks:
        - sandboxnet
      connections:
        max: 20
        idle: 10
    indexer:
      project_name: indexer
      sentry_enabled: false
      networks:
        sandboxnet:
          receiver_threads: 5
      connections:
        max: 5
        idle: 5
    scripts:
      networks:
        - sandboxnet

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.nexus_indexer_statefulset.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: {{ .Values.nexus_indexer_statefulset.name }}
  serviceName: ""
  template:
    metadata:
      labels:
        app: {{ .Values.nexus_indexer_statefulset.name }}
    {{- with $indexerConfig.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
    {{- with $indexerConfig.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- toYaml $indexerConfig.podSecurityContext | nindent 8 }}

    {{- with $indexerConfig.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $indexerConfig.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with $indexerConfig.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
  {{- end }}
      volumes:
        - name: nexus-sandbox-config
          configMap:
            name: nexus-sandbox-config
        - name: nexus-shared
          emptyDir: {}
      containers:
        - image: {{ $indexerConfig.images.api }}
          name: api
          ports:
            - containerPort: 14000
              name: nexus
          envFrom:
            - configMapRef:
                name: nexus-env
            - secretRef:
                name: {{ $indexerConfig.db.existingSecret | default "nexus-db-creds" }}
          env:
            - name: DB_HOSTNAME
              value: {{ $indexerConfig.db.hostname | default "localhost" | quote }}
          volumeMounts:
            - name: nexus-sandbox-config
              mountPath: /app/api/sandbox.yml
              subPath: sandbox.yml
            - name: nexus-shared
              mountPath: /etc/nexus
              subPath: nexus
        - image: {{ $indexerConfig.images.indexer }}
          name: indexer
          envFrom:
            - configMapRef:
                name: nexus-env
            - secretRef:
                name: {{ $indexerConfig.db.existingSecret | default "nexus-db-creds" }}
          env:
            - name: DB_HOSTNAME
              value: {{ $indexerConfig.db.hostname | default "localhost" | quote }}
          volumeMounts:
            - name: nexus-sandbox-config
              mountPath: /app/indexer/sandbox.yml
              subPath: sandbox.yml
            - name: nexus-shared
              mountPath: /etc/nexus
              subPath: nexus

{{- if not $indexerConfig.db.isExternal }}
        - image: {{ $indexerConfig.images.postgres }}
          name: db
          imagePullPolicy: IfNotPresent
          {{- with $indexerConfig.db.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: indexer-db
              subPath: data
          envFrom:
            - secretRef:
                name: {{ $indexerConfig.db.existingSecret | default "nexus-db-creds" }}
  volumeClaimTemplates:
    - metadata:
        name: indexer-db
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ $indexerConfig.storageClassName }}
        resources:
          requests:
            storage: {{ $indexerConfig.storage | default "300Gi" }}
{{- end }}

{{- $ingress := $indexerConfig.ingress | default dict }}
{{- if $ingress.enabled }}
{{- $ingressHosts := $ingress.hosts | default list }}
{{- if eq (len $ingressHosts) 0 }}
{{- fail "ingress.hosts is required when ingress.enabled is true" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus
  namespace: {{ .Release.Namespace }}
{{- with $ingress.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  ingressClassName: {{ $ingress.className }}
  {{- if $ingress.tls }}
  tls:
    {{- range $ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $h := $ingressHosts }}
    - host: {{ $h | quote }}
      http:
        paths:
          - pathType: {{ $ingress.pathType | default "Prefix" }}
            path: /
            backend:
              service:
                name: nexus
                port:
                  number: 14000
    {{- end }}
{{- end }}

{{- $gateway := $indexerConfig.gateway | default dict }}
{{- if $gateway.enabled }}
{{- $gatewayHosts := $gateway.hosts | default list }}
{{- if eq (len $gatewayHosts) 0 }}
{{- fail "gateway.hosts is required when gateway.enabled is true" }}
{{- end }}
{{- $useTLS := ne ($gateway.tlsSecretName | toString) "" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nexus
  namespace: {{ .Release.Namespace }}
{{- with $gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with $gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  gatewayClassName: {{ $gateway.className | default "envoy" }}
  listeners:
    {{- range $i, $h := $gatewayHosts }}
    {{- if $useTLS }}
    - name: {{ printf "https-%d" $i }}
      hostname: {{ $h | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $gateway.tlsSecretName | quote }}
    {{- else }}
    - name: {{ printf "http-%d" $i }}
      hostname: {{ $h | quote }}
      port: 80
      protocol: HTTP
    {{- end }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  namespace: {{ .Release.Namespace }}
{{- with $gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  parentRefs:
    - name: nexus
  hostnames:
    {{- range $h := $gatewayHosts }}
    - {{ $h | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nexus
          port: 14000
{{- $cors := $gateway.cors | default dict }}
{{- if $cors.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: nexus-cors
  namespace: {{ .Release.Namespace }}
{{- with $gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexus
  cors:
    {{- with $cors.allowOrigins }}
    allowOrigins:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $cors.allowMethods }}
    allowMethods:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $cors.allowHeaders }}
    allowHeaders:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $cors.exposeHeaders }}
    exposeHeaders:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $cors.maxAge }}
    maxAge: {{ . | quote }}
    {{- end }}
    allowCredentials: {{ $cors.allowCredentials | default false }}
{{- end }}
{{- $rl := $gateway.rateLimit | default dict }}
{{- $to := $gateway.timeout | default dict }}
{{- $conn := $gateway.connection | default dict }}
{{- $client := $gateway.client | default dict }}
{{- $bt := or $rl.enabled $to.enabled $conn.enabled }}
{{- if $bt }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: nexus-backend-traffic
  namespace: {{ .Release.Namespace }}
{{- with $gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexus
  {{- if $rl.enabled }}
  rateLimit:
    type: Local
    local:
      rules:
        {{- toYaml $rl.rules | nindent 8 }}
  {{- end }}
  {{- if $to.enabled }}
  timeout:
    {{- with $to.tcp }}
    tcp:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $to.http }}
    http:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if $conn.enabled }}
  connection:
    bufferLimit: {{ $conn.bufferLimit | quote }}
  {{- end }}
{{- end }}
{{- if $client.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: nexus-client-traffic
  namespace: {{ .Release.Namespace }}
{{- with $gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexus
  connection:
    bufferLimit: {{ $client.bufferLimit | quote }}
{{- end }}
{{- end }}

{{- end }}
