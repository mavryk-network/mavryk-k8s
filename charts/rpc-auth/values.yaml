# Images not part of the mavryk-k8s repo go here
images:

# Images that are part of the mavryk-k8s repo go here
mavryk_k8s_images:
  rpc_auth: mavryk-k8s-rpc-auth:dev

redis:
  host: redis-service
  port: 6379

# Gateway API alternative to the hardcoded Ingresses defined in the
# rpc-auth template (rpc-vending-machine-ingress / mavryk-rpc-ingress).
# When enabled, creates:
#   - A Gateway listening on the configured hostname
#   - An HTTPRoute for /vending-machine and /vending-machine/{chainId}
#     forwarding to the rpc-auth Service (port 8080)
#   - An HTTPRoute for /mavryk-node-rpc/{nonce}/{path} forwarding to the
#     mavryk-node-rpc Service (port 8732)
#   - An Envoy Gateway SecurityPolicy attaching ext_authz to the mavryk-rpc
#     HTTPRoute so requests are first authorized by rpc-auth's /auth endpoint
#     (the Gateway API equivalent of nginx's auth-url annotation).
gateway:
  enabled: false
  className: envoy
  host: ""
  # Annotations on the Gateway (e.g. cert-manager.io/cluster-issuer).
  annotations: {}
  labels: {}
  # Name of the Secret holding the TLS cert for the HTTPS listener. Leave
  # empty to create an HTTP-only listener.
  tlsSecretName: ""
  # CORS — replaces nginx `enable-cors` / `cors-allow-*` annotations. Rendered
  # as an Envoy Gateway SecurityPolicy targeting the Gateway, so it applies to
  # both HTTPRoutes (vending-machine and mavryk-rpc) without conflicting with
  # the existing extAuth SecurityPolicy that targets the mavryk-rpc HTTPRoute
  # (SecurityPolicies can stack when their targetRefs are different).
  cors:
    enabled: false
    allowOrigins:
      - "*"
    allowMethods:
      - GET
      - POST
      - OPTIONS
    allowHeaders: []
    exposeHeaders:
      - "*"
    maxAge: 1h
    allowCredentials: false
  # Local (per-pod) rate limit — replaces nginx `limit-rps` /
  # `limit-burst-multiplier`. Rendered into the BackendTrafficPolicy.
  rateLimit:
    enabled: false
    rules:
      - limit:
          requests: 5
          unit: Second
  # Upstream (Envoy → backend) timeouts — replaces nginx
  # `proxy-connect-timeout` / `proxy-read-timeout` / `proxy-send-timeout`.
  # Rendered into the BackendTrafficPolicy. `tcp` and `http` blocks are
  # passed verbatim, so any field Envoy Gateway's BackendTrafficPolicy
  # `spec.timeout.{tcp,http}` accepts works here.
  timeout:
    enabled: false
    tcp:
      connectTimeout: 1h
    http:
      connectionIdleTimeout: 1h
      requestTimeout: 1h
  # Upstream per-connection buffer limit — closest analogue to nginx
  # `proxy-buffer-size`. Rendered into the BackendTrafficPolicy. nginx's
  # `proxy-buffers-number` and `proxy-max-temp-file-size` have no Envoy
  # equivalent (Envoy streams natively, doesn't spill to disk).
  connection:
    enabled: false
    bufferLimit: "32Ki"
  # Downstream (client → Envoy) per-connection buffer limit — closest
  # analogue to nginx `proxy-buffering off`. Envoy already streams by
  # default; this just caps how much it holds for a slow client. Rendered
  # as a ClientTrafficPolicy.
  client:
    enabled: false
    bufferLimit: "32Ki"
