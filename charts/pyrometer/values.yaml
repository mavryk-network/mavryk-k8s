images:
  pyrometer: mavrykdynamics/mavryk-pyrometer:latest
mavryk_k8s_images:
  utils: ghcr.io/mavryk-network/mavryk-k8s-utils:master

# Pass below the pyrometer config, in yaml format
config:
  node_monitor:
    nodes:
    - http://mavryk-node-rpc:8732
  ui:
    enabled: false
    host: "0.0.0.0"
    port: 8080
  webhook:
    enabled: true
    url: http://127.0.0.1:31732/pyrometer_webhook
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: "" # fill in the desired hostname for your ingress
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API alternative to `ingress` above. Mutually exclusive in practice:
# enable one or the other. When enabled, creates a Gateway + HTTPRoute pair
# routing all traffic to the pyrometer Service on port 8080.
gateway:
  enabled: false
  # Name of the GatewayClass to attach the Gateway to (e.g. "envoy").
  className: envoy
  # Public hostname. Required when gateway.enabled is true.
  host: ""
  # Annotations on the Gateway resource. Add the cert-manager cluster-issuer
  # annotation here to have cert-manager auto-issue the listener's cert
  # (e.g. cert-manager.io/cluster-issuer: letsencrypt-prod).
  annotations: {}
  labels: {}
  # Name of the Secret holding the TLS cert for the HTTPS listener. Leave
  # empty to create an HTTP-only listener (no TLS).
  tlsSecretName: ""
  # CORS — replaces nginx `enable-cors` / `cors-allow-*` annotations.
  # Rendered as an Envoy Gateway SecurityPolicy targeting the Gateway, so
  # it applies to every HTTPRoute attached to the Gateway.
  cors:
    enabled: false
    allowOrigins:
      - "*"
    allowMethods:
      - GET
      - POST
      - OPTIONS
    allowHeaders: []
    exposeHeaders:
      - "*"
    maxAge: 1h
    allowCredentials: false
  # Local (per-pod) rate limit — replaces nginx `limit-rps` /
  # `limit-burst-multiplier`. Rendered into the BackendTrafficPolicy.
  rateLimit:
    enabled: false
    rules:
      - limit:
          requests: 5
          unit: Second
  # Upstream (Envoy → backend) timeouts — replaces nginx
  # `proxy-connect-timeout` / `proxy-read-timeout` / `proxy-send-timeout`.
  # Rendered into the BackendTrafficPolicy. `tcp` and `http` blocks are
  # passed verbatim, so any field Envoy Gateway's BackendTrafficPolicy
  # `spec.timeout.{tcp,http}` accepts works here.
  timeout:
    enabled: false
    tcp:
      connectTimeout: 1h
    http:
      connectionIdleTimeout: 1h
      requestTimeout: 1h
  # Upstream per-connection buffer limit — closest analogue to nginx
  # `proxy-buffer-size`. Rendered into the BackendTrafficPolicy. nginx's
  # `proxy-buffers-number` and `proxy-max-temp-file-size` have no Envoy
  # equivalent (Envoy streams natively, doesn't spill to disk).
  connection:
    enabled: false
    bufferLimit: "32Ki"
  # Downstream (client → Envoy) per-connection buffer limit — closest
  # analogue to nginx `proxy-buffering off`. Envoy already streams by
  # default; this just caps how much it holds for a slow client. Rendered
  # as a ClientTrafficPolicy.
  client:
    enabled: false
    bufferLimit: "32Ki"

# Type of the service exposing the pyrometer deployment
serviceType: NodePort

persistence:
  storageClassName:
  storage: 1G

# Prometheus Operator is required in your cluster in order to enable
# serviceMonitor and prometheusRule below.
serviceMonitor:
  enabled: false
prometheusRule:
  enabled: false
  numberOfUnhealthyBakersAlertThreshold: 1
  labels: {}
